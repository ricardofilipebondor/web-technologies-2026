<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSC - Autentificare</title>
    <link href="css/style.css" rel="stylesheet">
    <style>
        .auth-page { max-width: 420px; margin: 4rem auto; padding: 2rem; }
        .auth-page h2 { margin-top: 0; }
        .auth-page input, .auth-page select { width: 100%; margin-bottom: 0.75rem; }
        .auth-page button { width: 100%; }
        .auth-msg { color: var(--text-muted); font-size: 13px; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="auth-page card">
        <h2>Autentificare</h2>
        <form id="loginForm">
            <input type="text" id="loginUsername" class="input" placeholder="Username" required>
            <input type="password" id="loginPassword" class="input" placeholder="Parola" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div id="loginMessage" class="auth-msg"></div>

        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border);">

        <h2>Inregistrare</h2>
        <form id="registerForm">
            <input type="text" id="regUsername" class="input" placeholder="Username" required>
            <input type="email" id="regEmail" class="input" placeholder="Email" required>
            <input type="password" id="regPassword" class="input" placeholder="Parola" required>
            <input type="password" id="regPasswordConfirm" class="input" placeholder="Confirma parola" required>
            <select id="regRole" class="select">
                <option value="antrenor">Antrenor</option>
                <option value="responsabil_financiar">Responsabil financiar</option>
            </select>
            <button type="submit" class="btn btn-secondary">Inregistrare</button>
        </form>
        <div id="registerMessage" class="auth-msg"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
