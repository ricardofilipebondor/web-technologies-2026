<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSC - Autentificare</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-page card">
        <h1 class="auth-brand">eSC — Chess Club Manager</h1>
        <h2>Autentificare</h2>
        <form id="loginForm" class="auth-form">
            <label class="form-field">
                <span class="form-label">Username</span>
                <input type="text" id="loginUsername" class="input" name="username" required autocomplete="username">
            </label>
            <label class="form-field">
                <span class="form-label">Parola</span>
                <input type="password" id="loginPassword" class="input" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div id="loginMessage" class="auth-msg" role="status" aria-live="polite"></div>

        <hr class="auth-divider">

        <h2>Inregistrare</h2>
        <form id="registerForm" class="auth-form">
            <label class="form-field">
                <span class="form-label">Username</span>
                <input type="text" id="regUsername" class="input" name="username" required autocomplete="username">
            </label>
            <label class="form-field">
                <span class="form-label">Email</span>
                <input type="email" id="regEmail" class="input" name="email" required autocomplete="email">
            </label>
            <label class="form-field">
                <span class="form-label">Parola</span>
                <input type="password" id="regPassword" class="input" name="password" required autocomplete="new-password">
            </label>
            <label class="form-field">
                <span class="form-label">Confirma parola</span>
                <input type="password" id="regPasswordConfirm" class="input" name="password_confirm" required autocomplete="new-password">
            </label>
            <label class="form-field">
                <span class="form-label">Rol</span>
                <select id="regRole" class="select" name="role">
                    <option value="antrenor">Antrenor</option>
                    <option value="responsabil_financiar">Responsabil financiar</option>
                </select>
            </label>
            <button type="submit" class="btn btn-secondary">Inregistrare</button>
        </form>
        <div id="registerMessage" class="auth-msg" role="status" aria-live="polite"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
